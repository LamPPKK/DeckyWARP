name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: python3 -m py_compile main.py
      - run: shellcheck InstallPlugin.sh UninstallPlugin.sh scripts/*.sh
      - name: Validate tag and package versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const expected = process.argv[1];
            for (const file of ["package.json", "plugin.json"]) {
              const actual = JSON.parse(fs.readFileSync(file, "utf8")).version;
              if (actual !== expected) {
                throw new Error(file + " version " + actual + " does not match tag " + expected);
              }
            }
          ' "$version"
      - name: Package plugin
        run: |
          mkdir -p release/DeckyWARP
          cp -a \
            dist \
            packaging \
            scripts \
            InstallPlugin.sh \
            UninstallPlugin.sh \
            README.md \
            main.py \
            package.json \
            plugin.json \
            release/DeckyWARP/
          chmod +x release/DeckyWARP/InstallPlugin.sh
          chmod +x release/DeckyWARP/UninstallPlugin.sh
          chmod +x release/DeckyWARP/scripts/*.sh
          cd release
          zip -r DeckyWARP.zip DeckyWARP
          sha256sum DeckyWARP.zip > DeckyWARP.zip.sha256
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            release/DeckyWARP.zip
            release/DeckyWARP.zip.sha256
